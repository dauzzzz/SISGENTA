    function parseSpreadsheetText(rawText) {
      const rows = [];
      if (!rawText) return rows;
      const text = String(rawText).trim();
      if (text.includes('<tr') || text.includes('<TR') || text.includes('<Row')) {
        const parser = new DOMParser();
        const docDom = parser.parseFromString(text, 'text/html');
        docDom.querySelectorAll('tr, row').forEach(tr => {
          const cells = tr.querySelectorAll('td, th, cell, data');
          if (cells.length > 0) {
            const vals = Array.from(cells).map(c => (c.textContent || '').trim());
            if (vals.some(v => v !== '')) rows.push(vals);
          }
        });
        if (rows.length > 0) return rows;
      }
      text.split(/\r?\n/).filter(l => l.trim() !== '').forEach(line => {
        let cols = [];
        if (line.includes('\t')) cols = line.split('\t');
        else if (line.includes(';')) cols = line.split(';');
        else cols = line.split(',');
        const clean = cols.map(c => c.replace(/^["']|["']$/g, '').trim());
        if (clean.some(v => v !== '')) rows.push(clean);
      });
      return rows;
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch {}
    }

    function createQRSVG(text, size = 92) {
      const str = String(text || 'SDN-000').trim();
      // Gunakan library qrcode-generator standar ISO/IEC 18004 (dengan Reed-Solomon ECC) agar 100% terbaca semua scanner
      if (typeof qrcode !== 'undefined') {
        try {
          const qr = qrcode(0, 'M');
          qr.addData(str);
          qr.make();
          const moduleCount = qr.getModuleCount();
          const cell = size / (moduleCount + 4);
          let rects = '';
          for (let r = 0; r < moduleCount; r++) {
            for (let c = 0; c < moduleCount; c++) {
              if (qr.isDark(r, c)) {
                rects += `<rect x="${(c + 2) * cell}" y="${(r + 2) * cell}" width="${cell * 1.03}" height="${cell * 1.03}" fill="#0f172a" shape-rendering="crispEdges"/>`;
              }
            }
          }
          return `<div class="flex flex-col items-center"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="bg-white rounded-xl border border-slate-200 p-1 shadow-xs mx-auto"><rect width="${size}" height="${size}" fill="#fff" rx="6"/>${rects}</svg><span class="font-mono text-[9px] font-bold text-slate-600 mt-1">${str}</span></div>`;
        } catch (err) {
          console.warn('Fallback QR generator error:', err);
        }
      }

      // Fallback Reed-Solomon Version 1-L / 2-L
      const len = str.length;
      let version = len > 14 ? 2 : 1;
      const N = 17 + 4 * version;
      const cell = size / (N + 4);
      const encoded = encodeURIComponent(str);
      return `<div class="flex flex-col items-center"><img src="https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&ecc=M&margin=2&data=${encoded}" width="${size}" height="${size}" alt="${str}" class="bg-white rounded-xl border border-slate-200 p-1 shadow-xs mx-auto" /><span class="font-mono text-[9px] font-bold text-slate-600 mt-1">${str}</span></div>`;
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const role = document.getElementById('login-role').value;
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();

      if (IS_PREVIEW) {
        if (role === 'Admin') {
          state.currentUser = { id: 'ADMIN-1', name: state.schoolInfo.principal || 'Administrator', role: 'Admin', username };
          showToast(`Selamat datang Admin (${state.currentUser.name})`);
        } else if (role === 'Guru') {
          const found = state.teachers.find(t => t.nip === username && (t.password || '123456') === password);
          if (!found) return showToast('NIP atau Kata Sandi Guru tidak valid!', 'error');
          state.currentUser = { id: found.id, name: found.name, role: 'Guru', username: found.nip, classAssignment: found.classAssignment };
          state.filterAttClass = found.classAssignment && found.classAssignment !== 'Semua Kelas' ? found.classAssignment : 'Semua';
          state.filterRecapClass = state.filterAttClass;
          showToast(`Selamat datang, ${found.name} (${found.classAssignment})`);
        } else {
          const found = state.students.find(s => s.nisn === username && (s.password || '123456') === password);
          if (!found) return showToast('NISN atau Kata Sandi Siswa tidak valid!', 'error');
          state.currentUser = { id: found.id, name: found.name, role: 'Siswa', username: found.nisn, classId: found.classId };
          showToast(`Selamat datang, ${found.name}!`);
        }
        state.activeTab = 'dashboard';
        renderApp();
        return;
      }

      try {
        if (role === 'Admin') {
          const cred = await signInWithEmailAndPassword(auth, username, password);
          startFirestoreSync();
          state.currentUser = { id: cred.user.uid, name: state.schoolInfo.principal || cred.user.email, role: 'Admin', username: cred.user.email };
          showToast('Login Admin berhasil!');
        } else if (role === 'Guru') {
          const snap = await getDocs(collection(db, 'teachers'));
          let matched = null;
          snap.forEach(d => {
            const data = d.data();
            if (data.nip === username && (data.password || '123456') === password) matched = { id: d.id, ...data };
          });
          if (!matched) return showToast('Akun Guru tidak ditemukan atau password salah!', 'error');
          startFirestoreSync();
          state.currentUser = { id: matched.id, name: matched.name, role: 'Guru', username: matched.nip, classAssignment: matched.classAssignment };
          state.filterAttClass = matched.classAssignment && matched.classAssignment !== 'Semua Kelas' ? matched.classAssignment : 'Semua';
          state.filterRecapClass = state.filterAttClass;
          showToast(`Selamat datang, ${matched.name}!`);
        } else {
          const snap = await getDocs(collection(db, 'students'));
          let matched = null;
          snap.forEach(d => {
            const data = d.data();
            if (data.nisn === username && (data.password || '123456') === password) matched = { id: d.id, ...data };
          });
          if (!matched) return showToast('Akun Siswa tidak ditemukan atau password salah!', 'error');
          startFirestoreSync();
          state.currentUser = { id: matched.id, name: matched.name, role: 'Siswa', username: matched.nisn, classId: matched.classId };
          showToast(`Selamat datang, ${matched.name}!`);
        }
        state.activeTab = 'dashboard';
        renderApp();
      } catch (err) {
        showToast('Gagal masuk: Periksa kembali akun/koneksi Firebase Anda.', 'error');
      }
    }

    window.saveStudent = async (e) => {
      e.preventDefault();
      const editId = document.getElementById('st-edit-id').value;
      const name = document.getElementById('st-name').value.trim();
      const nisn = document.getElementById('st-nisn').value.trim();
      const classId = document.getElementById('st-class').value;
      const gender = document.getElementById('st-gender').value;
      const parentName = document.getElementById('st-parent').value.trim();
      const address = document.getElementById('st-address').value.trim();

      if (editId) {
        const existing = state.students.find(s => s.id === editId);
        const updated = { ...existing, name, nisn, classId, gender, parentName, address };
        if (IS_PREVIEW) {
          state.students = state.students.map(s => s.id === editId ? updated : s);
        } else if (db) {
          await setDoc(doc(db, 'students', editId), updated);
        }
        showToast(`Data murid ${name} berhasil diperbarui!`);
      } else {
        if (state.students.some(s => s.nisn === nisn)) {
          return showToast('NISN sudah terdaftar pada murid lain!', 'error');
        }
        const id = 'S' + Date.now();
        const item = { id, name, nisn, nis: state.schoolInfo.npsn || '20506021', classId, gender, parentName, address, password: '123456' };
        if (IS_PREVIEW) {
          state.students.push(item);
        } else if (db) {
          await setDoc(doc(db, 'students', id), item);
        }
        showToast(`Murid ${name} berhasil ditambahkan!`);
      }
      document.getElementById('modal-add-student').classList.add('hidden');
      renderApp();
    };

      const nuptk = document.getElementById('tc-nuptk').value.trim();

      const classAssignment = document.getElementById('tc-class').value;
      const phone = document.getElementById('tc-phone').value.trim();
      const email = document.getElementById('tc-email').value.trim();

      if (editId) {
        const existing = state.teachers.find(t => t.id === editId);
        const updated = { ...existing, name, nip, nuptk, role, classAssignment, phone, email };
        if (IS_PREVIEW) {
          state.teachers = state.teachers.map(t => t.id === editId ? updated : t);

          await setDoc(doc(db, 'teachers', editId), updated);

    window.recordAttendance = async (code, status, method = 'Input Manual') => {
      const clean = String(code || '').replace(/^SISWA-/i, '').trim();
      const st = state.students.find(s => s.nisn === clean || s.id === clean);
      if (!st) return showToast(`NISN "${clean}" tidak ditemukan!`, 'error');

      const recordId = `att_${state.todayStr}_${st.id}`;
      const newRec = {
        id: recordId,
        studentId: st.id,
        studentName: st.name,
        nisn: st.nisn,
        classId: st.classId,
        date: state.todayStr,
        status,
        time: new Date().toTimeString().substring(0, 5),
        method
      };

      playBeep();
      if (IS_PREVIEW) {
        const idx = state.attendanceRecords.findIndex(r => r.id === recordId);
        if (idx >= 0) state.attendanceRecords[idx] = newRec; else state.attendanceRecords.push(newRec);
      } else if (db) {
        await setDoc(doc(db, 'attendance', recordId), newRec);

      renderApp();

    window.downloadRecapExcel = (type = 'Bulanan') => {
      const effClass = state.filterRecapClass;
      const list = state.students.filter(s => effClass === 'Semua' || s.classId === effClass);

      let rows = `<tr><th colspan="8" style="background:#1e3a8a;color:#fff;font-size:14px;">REKAP PRESENSI SISWA (${type}) KELAS ${effClass.toUpperCase()} - ${state.schoolInfo.name.toUpperCase()}</th></tr>`;
      rows += `<tr style="background:#e2e8f0;font-weight:bold;"><th>No</th><th>NISN</th><th>Nama Siswa</th><th>Kelas</th><th>Hadir</th><th>Terlambat</th><th>Sakit/Izin</th><th>Alpa</th></tr>`;
      list.forEach((st, idx) => {
        const recs = state.attendanceRecords.filter(r => r.studentId === st.id);
        const h = recs.filter(r => r.status === 'Hadir').length;
        const t = recs.filter(r => r.status === 'Terlambat').length;
        const si = recs.filter(r => r.status === 'Sakit' || r.status === 'Izin').length;
        const a = recs.filter(r => r.status === 'Alpa').length;
        rows += `<tr><td>${idx+1}</td><td style="mso-number-format:'\\@';">${st.nisn}</td><td>${st.name}</td><td>${st.classId}</td><td>${h}</td><td>${t}</td><td>${si}</td><td>${a}</td></tr>`;
      });

      const blob = new Blob([`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1">${rows}</table></body></html>`], { type: 'application/vnd.ms-excel' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Rekap_Presensi_${type}_${effClass.replace(/\s+/g, '_')}_${state.todayStr}.xls`;
      a.click();
      showToast(`Rekap presensi ${type} kelas ${effClass} berhasil diunduh!`);
    };

    // Helper Pembaruan Diagnostik Visual Scanner
    window.updateScannerDiagnostics = ({ camState, scanState, rawResult, errorMsg }) => {
      const camEl = document.getElementById('diag-cam-status');
      const scanEl = document.getElementById('diag-scan-status');
      const rawEl = document.getElementById('diag-raw-result');
      const errEl = document.getElementById('diag-error-msg');
      if (camEl && camState !== undefined) camEl.textContent = camState;
      if (scanEl && scanState !== undefined) scanEl.textContent = scanState;
      if (rawEl && rawResult !== undefined) rawEl.textContent = rawResult || '-';
      if (errEl) {
        if (errorMsg) {
          errEl.textContent = errorMsg;
          errEl.classList.remove('hidden');
        } else {
          errEl.textContent = '';
          errEl.classList.add('hidden');
        }
      }
    };

    // Callback Utama Pemrosesan Hasil QR Code (Terhubung langsung ke fungsi recordAttendance yang sama dengan Input Manual)
    window.processDetectedQrCode = async (rawQrText, sourceLabel = 'Kamera QR') => {
      if (!rawQrText) return;
      const rawStr = String(rawQrText).trim();
      if (!rawStr) return;

      // Cooldown 2.5 detik untuk mencegah scan beruntun pada kartu yang sama
      const now = Date.now();
      if (rawStr === lastScannedCode && now - lastScannedTime < 2500) {
        return;
      }
      lastScannedCode = rawStr;
      lastScannedTime = now;

      // 1. Tampilkan hasil teks QR Code mentah pada diagnostik
      window.updateScannerDiagnostics({
        scanState: '🎯 QR Code Berhasil Terbaca!',
        rawResult: rawStr,
        errorMsg: ''
      });

      const resEl = document.getElementById('qr-scan-result');
      if (resEl) {
        resEl.className = "text-xs font-bold text-blue-800 bg-blue-100 p-2.5 rounded-xl border border-blue-300";
        resEl.textContent = `🔍 QR Terbaca: "${rawStr}" — Mencari data siswa...`;
      }

      // 2. Normalisasi hasil sesuai format QR SISGENTA (contoh: "SISWA-3195240210" atau JSON/teks menjadi NISN murni)
      let normalizedNisn = rawStr.replace(/^SISWA[-_:\s]*/i, '').trim();
      const digitMatch = normalizedNisn.match(/\d{4,20}/);
      if (digitMatch && !state.students.some(s => String(s.nisn).trim() === normalizedNisn)) {
        normalizedNisn = digitMatch[0];
      }

      // 3. Cari data siswa berdasarkan NISN atau ID
      const matchedStudent = state.students.find(s =>
        String(s.nisn).trim() === normalizedNisn ||
        String(s.nisn).trim() === rawStr ||
        String(s.id).trim() === normalizedNisn ||
        String(s.id).trim() === rawStr
      );

      if (!matchedStudent) {
        window.updateScannerDiagnostics({
          scanState: '⚠️ QR Terbaca, Siswa Tidak Ditemukan',
          rawResult: `${rawStr} (NISN: ${normalizedNisn})`,
          errorMsg: `Data siswa dengan NISN "${normalizedNisn}" tidak ditemukan di database.`
        });
        if (resEl) {
          resEl.className = "text-xs font-bold text-rose-800 bg-rose-100 p-2.5 rounded-xl border border-rose-300";
          resEl.textContent = `❌ QR Terbaca (${rawStr}), tetapi NISN "${normalizedNisn}" tidak terdaftar!`;
        }
        window.showToast(`QR Terbaca (${normalizedNisn}), namun siswa tidak ditemukan!`, 'error');
        return;
      }

      // 4. Panggil fungsi absensi yang sama persis dengan input manual
      await window.recordAttendance(matchedStudent.nisn, 'Hadir', sourceLabel);

      // 5. Tampilkan hasil absensi pada modal agar scanner tetap bisa memindai siswa berikutnya
      const modal = document.getElementById('modal-camera-scanner');
      if (modal && state.isCameraScanning) {
        modal.classList.remove('hidden');
      }

      window.updateScannerDiagnostics({
        camState: '🟢 Kamera Aktif',
        scanState: `✅ Tercatat Hadir: ${matchedStudent.name} (${matchedStudent.classId})`,
        rawResult: `${rawStr} → NISN: ${matchedStudent.nisn}`,
        errorMsg: ''
      });

      const updatedResEl = document.getElementById('qr-scan-result');
      if (updatedResEl) {
        updatedResEl.className = "text-xs font-bold text-emerald-800 bg-emerald-100 p-2.5 rounded-xl border border-emerald-300";
        updatedResEl.textContent = `✅ BERHASIL: ${matchedStudent.name} (${matchedStudent.classId}) — NISN ${matchedStudent.nisn} tercatat HADIR!`;
      }
    };

    // Loop Decoding Frame Video secara Langsung menggunakan Canvas + jsQR + BarcodeDetector
    function attachContinuousVideoDecoder(videoElement) {
      if (fallbackScanTimer) {
        clearInterval(fallbackScanTimer);
        fallbackScanTimer = null;
      }
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      let nativeDetector = null;
      if ('BarcodeDetector' in window) {
        try {
          nativeDetector = new window.BarcodeDetector({ formats: ['qr_code'] });
        } catch {}
      }

      scanFrameCount = 0;
      fallbackScanTimer = setInterval(async () => {
        if (!state.isCameraScanning) return;
        const vid = videoElement || document.querySelector('#qr-reader-box video');
        if (!vid || vid.readyState < 2 || vid.videoWidth === 0) return;

        scanFrameCount++;
        if (scanFrameCount % 5 === 0) {
          const scanEl = document.getElementById('diag-scan-status');
          if (scanEl && !scanEl.textContent.includes('Tercatat Hadir')) {
            scanEl.textContent = `🔄 Mencari QR Code... (Frame #${scanFrameCount} • ${vid.videoWidth}x${vid.videoHeight})`;
          }
        }

        // Metode A: jsQR pada ImageData Canvas (Bekerja di semua browser: Chrome, Safari, Edge, Firefox)
        if (typeof jsQR !== 'undefined') {
          try {
            canvas.width = vid.videoWidth;
            canvas.height = vid.videoHeight;
            ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const qrCode = jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: 'attemptBoth'
            });
            if (qrCode && qrCode.data) {
              window.processDetectedQrCode(qrCode.data, 'Kamera QR (jsQR)');
              return;
            }
          } catch (e) {}
        }

        // Metode B: Native BarcodeDetector API
        if (nativeDetector) {
          try {
            const barcodes = await nativeDetector.detect(vid);
            if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
              window.processDetectedQrCode(barcodes[0].rawValue, 'Kamera QR (Native)');
            }
          } catch (e) {}
        }
      }, 150);
    }

    window.startCameraWithConfig = async (cameraIdOrMode = null) => {
      const resEl = document.getElementById('qr-scan-result');
      const readerBox = document.getElementById('qr-reader-box');
      if (!readerBox) return;

      if (fallbackScanTimer) { clearInterval(fallbackScanTimer); fallbackScanTimer = null; }
      if (fallbackVideoStream) { fallbackVideoStream.getTracks().forEach(t => t.stop()); fallbackVideoStream = null; }
      if (html5QrScanner) {
        try {
          if (html5QrScanner.isScanning) await html5QrScanner.stop();
          await html5QrScanner.clear();
        } catch {}
        html5QrScanner = null;
      }

      window.updateScannerDiagnostics({
        camState: '⏳ Mengakses kamera perangkat...',
        scanState: 'Menunggu video kamera aktif...',
        rawResult: '-',
        errorMsg: ''
      });

      if (resEl) {
        resEl.className = "text-xs font-bold text-blue-700 bg-blue-50 p-2.5 rounded-xl border border-blue-200";
        resEl.textContent = "⏳ Sedang menghubungkan ke kamera perangkat...";
      }

      // 1. Coba inisialisasi dengan Html5Qrcode + Pasang juga decoder kanvas jsQR paralel
      if (typeof Html5Qrcode !== 'undefined') {
        try {
          html5QrScanner = new Html5Qrcode("qr-reader-box");
          try {
            const devices = await Html5Qrcode.getCameras();
            if (devices && devices.length > 0) {
              state.cameraDevices = devices;
              const selectEl = document.getElementById('camera-device-select');
              if (selectEl) {
                const backIdx = devices.findIndex(d => /back|rear|belakang|environment/i.test(d.label || ''));
                const defaultIdx = backIdx >= 0 ? backIdx : devices.length - 1;
                selectEl.innerHTML = devices.map((d, idx) =>
                  `<option value="${d.id}" ${(cameraIdOrMode === d.id || (!cameraIdOrMode && idx === defaultIdx)) ? 'selected' : ''}>📷 ${d.label || 'Kamera ' + (idx + 1)}</option>`
                ).join('');
                selectEl.classList.remove('hidden');
              }
            }
          } catch {}

          const configsToTry = [];
          if (cameraIdOrMode && typeof cameraIdOrMode === 'string' && cameraIdOrMode !== 'environment' && cameraIdOrMode !== 'user') {
            configsToTry.push(cameraIdOrMode);
          }
          configsToTry.push({ facingMode: { ideal: "environment" } });
          if (state.cameraDevices && state.cameraDevices.length > 0) {
            const backCam = state.cameraDevices.find(d => /back|rear|belakang|environment/i.test(d.label || ''));
            configsToTry.push(backCam ? backCam.id : state.cameraDevices[state.cameraDevices.length - 1].id);
          }
          configsToTry.push({ facingMode: "user" });

          let started = false;
          for (const cfg of configsToTry) {
            if (started) break;
            try {
              await html5QrScanner.start(
                cfg,
                { fps: 12, qrbox: { width: 220, height: 220 } },
                (decodedText) => {
                  window.processDetectedQrCode(decodedText, 'Kamera QR');
                },
                () => {}
              );
              started = true;
            } catch {}
          }

          if (started) {
            window.updateScannerDiagnostics({
              camState: '🟢 Kamera Aktif (Html5Qrcode + jsQR Engine)',
              scanState: '🔄 Scanner sedang mencari QR Code...',
              errorMsg: ''
            });
            if (resEl) {
              resEl.className = "text-xs font-bold text-emerald-700 bg-emerald-50 p-2.5 rounded-xl border border-emerald-200";
              resEl.textContent = "✅ Kamera Aktif! Arahkan Kartu QR Pelajar ke kotak kamera.";
            }
            // Jalankan juga loop pembacaan kanvas jsQR pada elemen video Html5Qrcode agar deteksi 2x lebih responsif
            setTimeout(() => {
              const innerVideo = document.querySelector('#qr-reader-box video');
              if (innerVideo) attachContinuousVideoDecoder(innerVideo);
            }, 400);
            return;
          }
        } catch (err) {
          console.warn("Html5Qrcode init warning:", err);
        }
      }

      // 2. Fallback Native getUserMedia + Continuous jsQR & BarcodeDetector Loop
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          let stream = null;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
              audio: false
            });
          } catch {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          }
          fallbackVideoStream = stream;
          readerBox.innerHTML = `<video id="native-qr-video" autoplay playsinline muted class="w-full h-60 object-cover rounded-2xl"></video>`;
          const videoEl = document.getElementById('native-qr-video');
          if (videoEl) {
            videoEl.srcObject = stream;
            await videoEl.play();
            attachContinuousVideoDecoder(videoEl);
          }

          window.updateScannerDiagnostics({
            camState: '🟢 Kamera Aktif (Native Stream)',
            scanState: '🔄 Scanner sedang mencari QR Code...',
            errorMsg: ''
          });
          if (resEl) {
            resEl.className = "text-xs font-bold text-emerald-700 bg-emerald-50 p-2.5 rounded-xl border border-emerald-200";
            resEl.textContent = "✅ Kamera Perangkat Aktif! Arahkan Kartu QR ke layar.";
          }
          return;
        } catch (err) {
          console.error("Native camera fallback error:", err);
          window.updateScannerDiagnostics({
            camState: '🔴 Kamera Gagal Dibuka',
            scanState: 'Berhenti',
            errorMsg: `Error Kamera: ${err.message || err}`
          });
        }
      }

      if (resEl) {
        resEl.className = "text-xs font-bold text-amber-800 bg-amber-50 p-3 rounded-xl border border-amber-200";
        resEl.innerHTML = `⚠️ Akses video langsung dibatasi oleh browser/iframe. Gunakan tombol <b>"📸 Ambil Foto / Scan Gambar QR"</b> di bawah.`;
      }
    };

    window.handleQrImageFileScan = async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      const resEl = document.getElementById('qr-scan-result');
      window.updateScannerDiagnostics({
        scanState: '⏳ Memindai file gambar QR Code...',
        errorMsg: ''
      });
      if (resEl) {
        resEl.className = "text-xs font-bold text-blue-700 bg-blue-50 p-2.5 rounded-xl border border-blue-200";
        resEl.textContent = "⏳ Memindai gambar QR Code...";
      }

      // 1. Coba decode menggunakan jsQR melalui Canvas Image terlebih dahulu (tidak mematikan kamera yang sedang aktif)
      if (typeof jsQR !== 'undefined') {
        try {
          const decodedFromImg = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
                resolve(code ? code.data : null);
              };
              img.onerror = () => resolve(null);
              img.src = e.target.result;
            };
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(file);
          });

          if (decodedFromImg) {
            await window.processDetectedQrCode(decodedFromImg, 'Foto Kamera QR');
            return;
          }
        } catch {}
      }

      // 2. Fallback menggunakan Html5Qrcode scanFile
      try {
        if (typeof Html5Qrcode !== 'undefined') {
          if (html5QrScanner && html5QrScanner.isScanning) {
            try { await html5QrScanner.stop(); } catch {}
          }
          const fileScanner = new Html5Qrcode("qr-reader-box");
          const decodedText = await fileScanner.scanFile(file, true);
          await window.processDetectedQrCode(decodedText, 'Foto Kamera QR');
          return;
        }
      } catch (err) {
        window.updateScannerDiagnostics({
          scanState: '❌ Gagal membaca QR dari gambar',
          errorMsg: err?.message || String(err)
        });
        if (resEl) {
          resEl.className = "text-xs font-bold text-rose-700 bg-rose-50 p-2.5 rounded-xl border border-rose-200";
          resEl.textContent = "❌ QR Code tidak terbaca jelas pada foto. Pastikan gambar terang & fokus, atau pilih siswa di bawah.";
        }
      }
    };

    window.openCameraScannerModal = async () => {
      const modal = document.getElementById('modal-camera-scanner');
      if (!modal) return;
      modal.classList.remove('hidden');
      state.isCameraScanning = true;

      try {
        if (window.parent && window.parent !== window) {
          const iframes = window.parent.document.getElementsByTagName('iframe');
          for (let f of iframes) {
            if (!f.getAttribute('allow')?.includes('camera')) {
              const cur = f.getAttribute('allow') || '';
              f.setAttribute('allow', cur + '; camera; microphone');
            }
          }
        }
      } catch {}

      setTimeout(() => {
        window.startCameraWithConfig();
      }, 250);
    };

      if (nameLbl) nameLbl.textContent = 'Belum ada file dipilih';
      const prevBox = document.getElementById('journal-attachment-preview');
      if (prevBox) {
        prevBox.innerHTML = '';
        prevBox.classList.add('hidden');
      }
      const titleInp = document.getElementById('jr-title');
      if (titleInp) titleInp.value = '';
      const descInp = document.getElementById('jr-desc');
      if (descInp) descInp.value = '';

    window.handleJournalFileSelected = (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      const maxBytes = 5 * 1024 * 1024;
      if (file.size > maxBytes) {
        showToast('Ukuran file melebihi batas maksimal 5 MB!', 'error');
        event.target.value = '';
        return;
      }

      const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'];
      if (!validTypes.includes(file.type)) {
        showToast('Format file tidak didukung! Gunakan JPG, PNG, WEBP, atau PDF.', 'error');
        event.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = (uploadEvent) => {
        const base64Data = uploadEvent.target.result.split(',')[1];
        state.tempAttachment = {
          file,
          base64Data,
          type: file.type,
          name: file.name,
          size: file.size,
          previewUrl: URL.createObjectURL(file)
        };

        const nameLbl = document.getElementById('journal-file-name-label');
        if (nameLbl) nameLbl.textContent = file.name;

        const prevBox = document.getElementById('journal-attachment-preview');
        if (prevBox) {
          prevBox.classList.remove('hidden');
          const isPdf = file.type === 'application/pdf';
          if (isPdf) {
            prevBox.innerHTML = `
              <div class="flex items-center justify-between p-3 bg-white border border-slate-200 rounded-xl shadow-2xs">
                <div class="flex items-center gap-2 overflow-hidden">
                  <span class="text-xl">📄</span>
                  <div class="overflow-hidden">
                    <div class="font-bold text-slate-800 truncate">${file.name}</div>
                    <div class="text-[10px] text-slate-400 font-mono">${(file.size / 1024).toFixed(1)} KB (PDF)</div>
                  </div>
                </div>
                <button type="button" onclick="window.removeTempJournalAttachment()" class="px-2 py-1 bg-rose-50 text-rose-600 rounded-lg font-bold text-[11px] cursor-pointer">Hapus</button>
              </div>
            `;
          } else {
            prevBox.innerHTML = `
              <div class="space-y-2">
                <span class="text-[10px] font-bold text-slate-500 block">Pratinjau Bukti:</span>
                <div class="relative w-32 h-24 rounded-xl overflow-hidden border border-slate-200 shadow-2xs bg-slate-100 flex items-center justify-center">
                  <img src="${state.tempAttachment.previewUrl}" alt="Pratinjau" class="w-full h-full object-cover" />
                  <button type="button" onclick="window.removeTempJournalAttachment()" class="absolute top-1 right-1 px-2 py-0.5 bg-rose-600 text-white rounded-md font-bold text-[10px] shadow cursor-pointer">X</button>
                </div>
              </div>
            `;
          }
        }
      };
      reader.readAsDataURL(file);
    };

    window.removeTempJournalAttachment = () => {
      state.tempAttachment = null;
      const nameLbl = document.getElementById('journal-file-name-label');
      if (nameLbl) nameLbl.textContent = 'Belum ada file dipilih';
      const prevBox = document.getElementById('journal-attachment-preview');
      if (prevBox) {
        prevBox.innerHTML = '';

    window.saveJournal = async (e) => {
      e.preventDefault();
      const isSiswa = state.currentUser.role === 'Siswa';
      const stId = isSiswa ? state.currentUser.id : document.getElementById('jr-student')?.value;
      const st = state.students.find(s => s.id === stId) || { id: stId, name: state.currentUser.name, classId: state.currentUser.classId || 'Kelas 1' };
      const id = 'JRN_' + Date.now();

      let attachmentUrl = '';
      let attachmentPath = '';
      let attachmentName = '';
      let attachmentType = '';
      let attachmentSize = 0;

      const saveBtn = document.getElementById('btn-save-journal');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = '⏳ Mengunggah ke Google Drive & Menyimpan...';
      }

      try {
        if (state.tempAttachment) {
          attachmentName = state.tempAttachment.name;
          attachmentType = state.tempAttachment.type;
          attachmentSize = state.tempAttachment.size;

          if (typeof GOOGLE_APPS_SCRIPT_URL !== 'undefined' && GOOGLE_APPS_SCRIPT_URL && !GOOGLE_APPS_SCRIPT_URL.includes('AKfycbz...')) {
            const payload = {
              file: state.tempAttachment.base64Data,
              filename: attachmentName,
              mimetype: attachmentType,
              studentId: st.id
            };

            const resp = await fetch(GOOGLE_APPS_SCRIPT_URL, {
              method: 'POST',
              body: JSON.stringify(payload)
            });
            const result = await resp.json();
            if (result.status === 'success') {
              attachmentUrl = result.fileUrl;
              attachmentPath = result.fileId;
            } else {
              throw new Error(result.message || 'Gagal upload ke Google Drive');
            }
          } else {
            attachmentUrl = state.tempAttachment.previewUrl;
            attachmentPath = 'mock_drive_id_' + Date.now();
          }
        }

        const entry = {
          id,
          studentId: st.id,
          studentName: st.name,
          classId: st.classId,
          category: document.getElementById('jr-category').value,
          title: document.getElementById('jr-title').value.trim(),
          description: document.getElementById('jr-desc').value.trim(),
          date: state.todayStr,
          recordedBy: state.currentUser.name,
          attachmentUrl,
          attachmentPath,
          attachmentName,
          attachmentType,
          attachmentSize
        };

        if (IS_PREVIEW) {
          state.journals.unshift(entry);
        } else if (db) {
          await setDoc(doc(db, 'journals', id), entry);
        }

        document.getElementById('modal-add-journal').classList.add('hidden');
        showToast('Jurnal karakter & lampiran berhasil disimpan!');
        renderApp();
      } catch (err) {
        console.error("Gagal menyimpan jurnal:", err);
        showToast('Gagal mengunggah lampiran ke Google Drive. Periksa URL Apps Script Anda.', 'error');
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Simpan Jurnal & Lampiran';
        }
      }
    };

    window.deleteJournal = (id) => {
      if (!id) return;

    };

    window.cancelDeleteJournal = () => {
      state.pendingDeleteJournalId = null;
      renderApp();
    };

    window.confirmDeleteJournalNow = async () => {
      const targetId = state.pendingDeleteJournalId;
      if (!targetId) return;

      state.deletedJournalIds.add(targetId);
      const targetItem = state.journals.find(j => String(j.id) === String(targetId) || String(j.firestoreDocId) === String(targetId));
      if (targetItem) {
        if (targetItem.id) state.deletedJournalIds.add(String(targetItem.id));
        if (targetItem.firestoreDocId) state.deletedJournalIds.add(String(targetItem.firestoreDocId));
      }

      state.journals = state.journals.filter(
        j => String(j.id) !== String(targetId) && String(j.firestoreDocId) !== String(targetId)
      );
      state.pendingDeleteJournalId = null;
      renderApp();

      if (!IS_PREVIEW && db) {
        try {
          const docIdToDelete = targetItem?.firestoreDocId || targetId;
          await deleteDoc(doc(db, 'journals', String(docIdToDelete)));
        } catch (err) {
          console.warn("Firestore delete info:", err);
        }
      }
      showToast('Jurnal berhasil dihapus dari tampilan!');
    };

    window.handleLogoUpload = (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 200;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/png', 0.85);
          state.schoolInfo.logo = dataUrl;
          showToast('Logo berhasil dimuat! Klik "Simpan Identitas" untuk menyimpan.');
          renderApp();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

                <div class="flex justify-between gap-2"><span class="text-slate-500">Status Kamera:</span><span id="diag-cam-status" class="font-bold text-emerald-700">Menyiapkan...</span></div>
                <div class="flex justify-between gap-2"><span class="text-slate-500">Status Scanner:</span><span id="diag-scan-status" class="font-bold text-blue-700">Menunggu kamera...</span></div>
                <div class="flex justify-between gap-2"><span class="text-slate-500">Hasil QR Terbaca:</span><span id="diag-raw-result" class="font-mono font-bold text-slate-900">-</span></div>
                <div id="diag-error-msg" class="hidden text-rose-600 font-bold pt-1 border-t border-rose-200"></div>
              </div>

              <div id="qr-scan-result" class="text-xs font-bold text-emerald-700 bg-emerald-50 p-2.5 rounded-xl border border-emerald-200">
                Arahkan Kartu QR Pelajar ke kamera...
              </div>

              <div class="p-3 bg-blue-50 border border-blue-200 rounded-2xl space-y-2 text-left">
                <label class="text-[11px] font-bold text-blue-900 block">📸 Kamera HP / Ambil Foto Kartu QR (Alternatif Anti-Gagal):</label>
                <input type="file" accept="image/*" capture="environment" onchange="window.handleQrImageFileScan(event)" class="block w-full text-xs text-slate-700 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer" />
              </div>

              <div class="pt-2 border-t text-left space-y-2">
                <label class="text-[11px] font-bold text-slate-600 block">Atau Pilih / Ketik NISN Siswa Secara Langsung:</label>
                <div class="flex gap-2">
                  <select onchange="if(this.value) { document.getElementById('modal-manual-nisn').value = this.value; }" class="w-1/2 p-2 border rounded-xl text-xs font-bold bg-slate-50">
                    <option value="">-- Pilih Siswa --</option>
                    ${state.students.map(s => `<option value="${s.nisn}">${s.name} (${s.classId})</option>`).join('')}
                  </select>
                  <input type="text" id="modal-manual-nisn" placeholder="NISN..." class="w-1/2 p-2 border rounded-xl text-xs font-mono font-bold" />
                </div>
                <button onclick="window.recordAttendance(document.getElementById('modal-manual-nisn').value, 'Hadir', 'Scan Manual')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold cursor-pointer shadow-xs">✅ Catat Hadir Sekarang</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    renderApp();
  </script>
</body>
</html>
